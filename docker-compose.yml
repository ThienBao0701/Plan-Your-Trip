# INFRA-02 — local production-parity stack for Plan Your Trip (single-host Docker Compose).
# Services: db (self-managed SQL Server) → db-init (create DB only) → app (Spring Boot, prod profile,
# Flyway-owned schema) → web (Nginx: serves Flutter Web + reverse-proxies /api, SAME-ORIGIN so no CORS).
#
# Security posture (see DEPLOYMENT.md §21):
#   - SQL Server has NO published host port → reachable only on the internal Docker network.
#   - app port 8080 is NOT published → reachable only via the web (Nginx) reverse proxy.
#   - all secrets come from a git-ignored host .env (see .env.example); none are committed.
#
# Startup order is enforced by healthchecks: db healthy → db-init completes → app healthy → web.

services:
    # One-shot: provisions the named backup volume for the SQL Server runtime user.
  # Docker creates named volumes as root-owned; SQL Server runs as uid/gid 10001.
  backup-volume-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - mssql-backups:/var/opt/mssql/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'chown 10001:10001 /var/opt/mssql/backups && chmod 750 /var/opt/mssql/backups'
    restart: "no"

  # SQL Server
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      backup-volume-init:
        condition: service_completed_successfully
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - mssql-data:/var/opt/mssql
      - mssql-backups:/var/opt/mssql/backups
      - ./scripts:/scripts:ro
    networks: [internal]
    restart: unless-stopped
    # $$ escapes compose interpolation so the password is read from the container env at runtime
    # (it is never rendered into the resolved compose config or logs).
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: creates ONLY the application database (never any table — Flyway owns all schema objects).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      APP_DB_NAME: ${APP_DB_NAME:-PlanYourTrip}
    volumes:
      - ./db/init:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - '/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -v APP_DB_NAME="$$APP_DB_NAME" -i /init/create-database.sql'
    networks: [internal]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: planyourtrip-backend:local
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Datasource points at the internal `db` host. For LOCAL verification the container uses a
      # self-signed cert → trustServerCertificate=true (see .env.example). PROD must use a trusted
      # cert with trustServerCertificate=false (DEPLOYMENT.md §21).
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      VOUCHER_SIGNING_SECRET: ${VOUCHER_SIGNING_SECRET:?}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_FULL_NAME: ${ADMIN_BOOTSTRAP_FULL_NAME:-Administrator}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    expose:
      - "8080"        # internal only — NOT published to the host
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s   # allow Flyway migration + Hibernate validate + bootstrap on first boot

  web:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Built Flutter Web bundle. Build it (DEPLOYMENT.md §11) then point WEB_ROOT at its build/web dir.
      - ${WEB_ROOT:-./web/build}:/usr/share/nginx/html:ro
    ports:
      - "${WEB_HTTP_PORT:-8088}:80"    # local: http://localhost:8088 . VPS: put TLS in front (DEPLOYMENT.md §14).
    networks: [internal]
    restart: unless-stopped

volumes:
  mssql-data:
  mssql-backups:

networks:
  internal:
    driver: bridge
