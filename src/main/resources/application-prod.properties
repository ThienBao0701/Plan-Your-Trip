# ─────────────────────────────────────────────────────────────────────────────
# DB-02 — Production profile (Microsoft SQL Server target)
#
# Activated with the `prod` Spring profile, e.g.:
#     SPRING_PROFILES_ACTIVE=prod java -jar planyourtrip-backend.jar
# The default (dev/test) profile is UNCHANGED and keeps using in-memory H2 —
# this file is ONLY loaded when `prod` is active.
#
# Target database is Microsoft SQL Server, per CLAUDE_backend.md ("Database:
# SQL Server" + NVARCHAR / Vietnamese_CI_AI / sendStringParametersAsUnicode
# conventions) and the mssql-jdbc runtime driver already on the classpath.
#
# EVERY datasource value below comes from the environment. NOTHING sensitive is
# committed, and there are NO fallback defaults for url/username/password: if the
# environment does not supply them the application FAILS FAST at startup instead
# of silently booting against the wrong database. That failure is expected until
# DB-03 provisions the schema + migrations.
# ─────────────────────────────────────────────────────────────────────────────

# ── Datasource (externalised; no committed hosts/credentials) ────────────────
# Recommended SQL Server URL shape (supply the real host/db via the env var):
#   jdbc:sqlserver://<host>:1433;databaseName=<db>;encrypt=true;trustServerCertificate=false;sendStringParametersAsUnicode=true;loginTimeout=30
# - encrypt=true + trustServerCertificate=false → TLS on, certificate verified
#   (do NOT disable certificate verification in production).
# - sendStringParametersAsUnicode=true → preserves Vietnamese Unicode (NVARCHAR).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# ── Flyway (DB-03) — versioned schema ownership for SQL Server ────────────────
# Flyway runs the db/migration scripts BEFORE Hibernate initialises, then Hibernate
# only validates the result (below). Enabled only in prod; dev/test H2 keeps it off.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# Schema is owned by the Flyway migrations above. Hibernate MUST only validate that
# the live schema matches the entities — never create/alter. Pinned to `validate`
# here (not env-overridable) so prod can never auto-DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# All entity timestamps are java.time.Instant (UTC); persist/read them as UTC so
# behaviour is server-timezone independent on SQL Server.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Vietnamese Unicode: map String columns to NVARCHAR (not VARCHAR). This matches the
# V1 migration (generated with the same setting) so ddl-auto=validate stays consistent,
# and satisfies the CLAUDE_backend.md NVARCHAR requirement.
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# ── HikariCP connection pool (conservative small/medium defaults; overridable) ─
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# ── DB-04 production bootstrap — optional initial admin (env-gated) ───────────
# ProductionBootstrap creates required system reference data (default referral campaign +
# loyalty redemption policy) idempotently on prod startup. It ALSO creates an initial admin,
# but ONLY when both email and password below are supplied via the environment. Left empty by
# default → the admin step is skipped (NO default password is ever committed or used). The
# password is hashed with the app PasswordEncoder and never logged; an existing user is never
# overwritten.
app.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.bootstrap.admin.full-name=${ADMIN_BOOTSTRAP_FULL_NAME:Administrator}
