server.port=${PORT:8080}
spring.application.name=planyourtrip-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:planyourtrip;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-development-secret-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
server.error.include-stacktrace=never
server.error.include-message=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false

# ── Phase 7.27 — Real payment provider config (bound to PaymentProviderProperties) ──
# FAKE placeholders only. Real credentials are injected via environment variables in a
# deployment and are NEVER committed. Signature verification is production-grade; the
# outbound checkout-API call is intentionally mocked (offline) pending real credentials.
payment.providers.vnpay.webhook-secret=${VNPAY_WEBHOOK_SECRET:vnpay-test-secret-not-real}
payment.providers.vnpay.checkout-base-url=${VNPAY_CHECKOUT_URL:https://sandbox.vnpayment.test/checkout/}
payment.providers.payos.webhook-secret=${PAYOS_WEBHOOK_SECRET:payos-test-secret-not-real}
payment.providers.payos.checkout-base-url=${PAYOS_CHECKOUT_URL:https://sandbox.payos.test/checkout/}
payment.providers.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_stripe-test-secret-not-real}
payment.providers.stripe.checkout-base-url=${STRIPE_CHECKOUT_URL:https://checkout.stripe.test/pay/}
payment.providers.momo.webhook-secret=${MOMO_WEBHOOK_SECRET:momo-test-secret-not-real}
payment.providers.momo.checkout-base-url=${MOMO_CHECKOUT_URL:https://sandbox.momo.test/checkout/}
