# INFRA-02 — Nginx: serve the Flutter Web SPA and reverse-proxy /api to the Spring Boot app.
# Same-origin by design (SPA + API share this origin) → NO CORS headers are emitted here.
# Mounted at /etc/nginx/conf.d/default.conf (see docker-compose web service).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling for API requests proxied through.
    client_max_body_size 20m;

    # ── API → Spring Boot (internal service name `app`, never exposed externally) ──
    # location `/api/` + proxy_pass WITHOUT a URI path preserves the full `/api/...` path,
    # matching the backend's /api/** mappings (e.g. /api/health/ready → app:8080/api/health/ready).
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Preserve the bearer token for JWT auth (passed by default, set explicitly for clarity).
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Flutter Web SPA ──
    # Serve the requested file if it exists, otherwise fall back to index.html so client-side
    # routes resolve. API paths are handled above and never reach this fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable Flutter build assets; keep index.html uncached so new builds are picked up.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|wasm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
